<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body data-page="admin">
<div id="site-nav"></div><main class="container section"><h3>Admin</h3>
<div class="row g-3 my-1" id="a-stats"></div>
<h5 class="mt-4">Orders</h5><div class="card"><div class="table-responsive"><table class="table mb-0"><thead><tr><th>#</th><th>User</th><th>Product</th><th>Qty</th><th>Total</th><th>Status / Delivery</th></tr></thead><tbody id="a-orders"></tbody></table></div></div>
<div class="row g-4 mt-1"><div class="col-lg-5"><h5>Credit wallet</h5><div class="card"><div class="card-body"><form id="credit-form"><input id="c-email" type="email" class="form-control mb-2" placeholder="User email" required><input id="c-amt" type="number" min="1" class="form-control mb-2" placeholder="Amount" required><button class="btn btn-brand">Credit</button></form></div></div></div>
<div class="col-lg-7"><h5>Users</h5><div class="card"><div class="table-responsive"><table class="table mb-0"><thead><tr><th>Email</th><th>Name</th><th>Balance</th></tr></thead><tbody id="a-users"></tbody></table></div></div></div></div>
</main><div id="site-footer"></div>
<div class="modal fade" id="orderModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><form class="modal-content" id="om-form">
  <div class="modal-header"><h5 class="modal-title" id="om-title"></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body"><p class="text-muted small" id="om-desc"></p>
    <label class="form-label">Quantity (<span id="om-range"></span>)</label><input type="number" class="form-control mb-3" id="om-qty" required>
    <div id="om-link-wrap"><label class="form-label">Profile / post link</label><input type="url" class="form-control mb-3" id="om-link" placeholder="https://..."></div>
    <div class="fs-5">Total: <strong id="om-total"></strong></div></div>
  <div class="modal-footer"><button class="btn btn-brand w-100">Place order</button></div></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
