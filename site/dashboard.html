<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body data-page="dashboard">
<div id="site-nav"></div><main class="container section">
<h3>Welcome, <span id="welcome"></span></h3>
<div class="row g-4 my-1">
  <div class="col-md-4"><div class="card h-100"><div class="card-body"><div class="text-muted">Wallet balance</div><div class="stat" id="balance"></div></div></div></div>
  <div class="col-md-8"><div class="card h-100"><div class="card-body"><h6>Add funds</h6>
    <form id="fund-form" class="row g-2"><div class="col-sm-6"><input id="fund-amt" type="number" min="100" class="form-control" placeholder="Amount" required></div>
    <div class="col-sm-6"><button class="btn btn-brand w-100">Pay with card / transfer</button></div>
    <div class="col-12 d-flex gap-2 flex-wrap"><button type="button" class="btn btn-sm btn-outline-secondary" data-amt="1000">1,000</button><button type="button" class="btn btn-sm btn-outline-secondary" data-amt="5000">5,000</button><button type="button" class="btn btn-sm btn-outline-secondary" data-amt="10000">10,000</button></div></form></div></div></div>
</div>
<h5 class="mt-4">My orders</h5><div class="card"><div class="table-responsive"><table class="table mb-0"><thead><tr><th>#</th><th>Product</th><th>Qty</th><th>Total</th><th>Status</th><th>Details</th></tr></thead><tbody id="orders"></tbody></table></div></div>
<h5 class="mt-4">Transactions</h5><div class="card"><div class="table-responsive"><table class="table mb-0"><thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Note</th></tr></thead><tbody id="tx"></tbody></table></div></div>
</main><div id="site-footer"></div>
<div class="modal fade" id="orderModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><form class="modal-content" id="om-form">
  <div class="modal-header"><h5 class="modal-title" id="om-title"></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body"><p class="text-muted small" id="om-desc"></p>
    <label class="form-label">Quantity (<span id="om-range"></span>)</label><input type="number" class="form-control mb-3" id="om-qty" required>
    <div id="om-link-wrap"><label class="form-label">Profile / post link</label><input type="url" class="form-control mb-3" id="om-link" placeholder="https://..."></div>
    <div class="fs-5">Total: <strong id="om-total"></strong></div></div>
  <div class="modal-footer"><button class="btn btn-brand w-100">Place order</button></div></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://js.paystack.co/v1/inline.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
