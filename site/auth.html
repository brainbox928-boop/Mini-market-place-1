<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login / Sign up</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body data-page="auth">
<div id="site-nav"></div><main class="container section"><div class="row justify-content-center g-4">
<div class="col-md-5"><div class="card"><div class="card-body p-4"><h4>Login</h4>
  <form id="login-form"><label class="form-label mt-2">Email</label><input id="l-email" type="email" class="form-control" required>
  <label class="form-label mt-2">Password</label><input id="l-pass" type="password" class="form-control" required>
  <button class="btn btn-brand w-100 mt-3">Login</button></form></div></div></div>
<div class="col-md-5"><div class="card"><div class="card-body p-4"><h4>Create account</h4>
  <form id="reg-form"><label class="form-label mt-2">Name</label><input id="r-name" class="form-control" required>
  <label class="form-label mt-2">Email</label><input id="r-email" type="email" class="form-control" required>
  <label class="form-label mt-2">Password (8+ chars)</label><input id="r-pass" type="password" minlength="8" class="form-control" required>
  <button class="btn btn-outline-brand w-100 mt-3">Sign up</button></form></div></div></div></div></main><div id="site-footer"></div>
<div class="modal fade" id="orderModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><form class="modal-content" id="om-form">
  <div class="modal-header"><h5 class="modal-title" id="om-title"></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body"><p class="text-muted small" id="om-desc"></p>
    <label class="form-label">Quantity (<span id="om-range"></span>)</label><input type="number" class="form-control mb-3" id="om-qty" required>
    <div id="om-link-wrap"><label class="form-label">Profile / post link</label><input type="url" class="form-control mb-3" id="om-link" placeholder="https://..."></div>
    <div class="fs-5">Total: <strong id="om-total"></strong></div></div>
  <div class="modal-footer"><button class="btn btn-brand w-100">Place order</button></div></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
