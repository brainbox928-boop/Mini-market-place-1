<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Services</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body data-page="services">
<div id="site-nav"></div><main class="container section"><h2 class="mb-3">Services</h2>
<div class="row g-2 mb-4"><div class="col-lg-8"><div class="d-flex flex-wrap gap-2" id="tabs"></div></div>
<div class="col-lg-4"><input id="search" class="form-control" placeholder="Search platform or service..."></div></div>
<div class="row g-4" id="list"></div></main><div id="site-footer"></div>
<div class="modal fade" id="orderModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><form class="modal-content" id="om-form">
  <div class="modal-header"><h5 class="modal-title" id="om-title"></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body"><p class="text-muted small" id="om-desc"></p>
    <label class="form-label">Quantity (<span id="om-range"></span>)</label><input type="number" class="form-control mb-3" id="om-qty" required>
    <div id="om-link-wrap"><label class="form-label">Profile / post link</label><input type="url" class="form-control mb-3" id="om-link" placeholder="https://..."></div>
    <div class="fs-5">Total: <strong id="om-total"></strong></div></div>
  <div class="modal-footer"><button class="btn btn-brand w-100">Place order</button></div></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
